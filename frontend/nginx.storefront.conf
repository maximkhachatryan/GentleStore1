# The path the visitor asked for, without its query string. The head include in index.html cannot
# use $uri: try_files has already rewritten it to /index.html by the time the page is processed.
map $request_uri $page_path {
    default "/";
    "~^(?<path>/[^?]*)" $path;
}

server {
    listen 80;

    # Docker's DNS, resolved per request: nginx starts even if the api container isn't up yet.
    resolver 127.0.0.11 valid=30s ipv6=off;
    # While the api container is gone its name falls through to outside DNS; every page waits on
    # that lookup for its head, so give up quickly and serve the default one.
    resolver_timeout 2s;
    set $api_upstream http://api:8080;

    # Link preview images, served from the storefront's own domain.
    location /_preview/ {
        rewrite ^/_preview/(.*)$ /api/public/link-preview/$1 break;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The page's title, description, canonical link, Open Graph tags and structured data, rendered
    # by the API and spliced into index.html (see the include there). Search engines, chat apps and
    # people all get the same HTML; the app takes over once its script runs.
    location ~ ^/_head(?<head_path>/[A-Za-z0-9/_-]*)$ {
        internal;
        proxy_pass $api_upstream/api/public/seo/head$head_path;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Inlined into the page as-is, so it must arrive uncompressed; and it needs no session.
        proxy_set_header Accept-Encoding "";
        proxy_set_header Cookie "";
        # A slow or missing API must not hold the page up for long.
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
        # Any failure answers empty, which makes the include fall back to index.html's own head.
        proxy_intercept_errors on;
        error_page 400 404 405 500 502 503 504 = @no_head;
    }

    # Paths the pattern above refuses (a "." in them, say) get the default head too.
    location /_head {
        internal;
        return 204;
    }

    location @no_head {
        return 204;
    }

    location = /robots.txt {
        proxy_pass $api_upstream/api/public/seo/robots.txt;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /sitemap.xml {
        proxy_pass $api_upstream/api/public/seo/sitemap.xml;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        root /usr/share/nginx/html;
        # Only text/html is processed, so this touches index.html and none of the assets.
        ssi on;
        # Never let nginx's "[an error occurred…]" text into the page; the default head stands in.
        ssi_silent_errors on;
        try_files $uri $uri/ /index.html;
    }
}
