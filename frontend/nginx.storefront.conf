# Link previews: chat apps' crawlers don't run JavaScript, so on store, category and product pages
# they get Open Graph tags rendered by the API instead of the empty SPA shell. People get the SPA.
map $http_user_agent $link_preview_bot {
    default 0;
    "~*(whatsapp|facebookexternalhit|facebot|telegrambot|twitterbot|slackbot|discordbot|linkedinbot|viber|skypeuripreview|pinterest|vkshare)" 1;
}

map "$link_preview_bot:$uri" $serve_link_preview {
    default 0;
    "~^1:/[a-z0-9-]+(/(product|category)/[0-9a-fA-F-]{36})?/?$" 1;
}

server {
    listen 80;

    # Docker's DNS, resolved per request: nginx starts even if the api container isn't up yet.
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $api_upstream http://api:8080;

    # Preview pages and their images, served from the storefront's own domain.
    location /_preview/ {
        rewrite ^/_preview/(.*)$ /api/public/link-preview/$1 break;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        root /usr/share/nginx/html;

        if ($serve_link_preview) {
            rewrite ^ /_preview/page$uri last;
        }

        try_files $uri $uri/ /index.html;
    }
}
