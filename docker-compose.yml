services:
  postgres:
    image: postgres:16
    container_name: gentlestore-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: gentlestore
      POSTGRES_USER: gentlestore
      POSTGRES_PASSWORD: gentlestore_dev_pw
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - gentlestore_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gentlestore -d gentlestore"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gentlestore-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development   # required for EF migrations + seeding
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=gentlestore;Username=gentlestore;Password=gentlestore_dev_pw"
      Jwt__Secret: "REPLACE_WITH_A_LONG_RANDOM_SECRET_OF_AT_LEAST_32_CHARACTERS"
      Cors__Origins__0: "http://localhost:5173"
      Cors__Origins__1: "http://localhost:5174"
      # Both sides of the payment conversation stay on the compose network: the API calls the
      # payment service, and the payment service posts status callbacks back to the API.
      PaymentService__BaseUrl: "http://payments:8080"
      PaymentService__CallbackBaseUrl: "http://api:8080"
    ports:
      - "5080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  # Its own service and its own database, in the same Postgres instance for development only.
  # EF creates `gentlestore_payments` on first run, so no init script is needed.
  payments:
    build:
      context: ./payment-service
      dockerfile: Dockerfile
    container_name: gentlestore-payments
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=gentlestore_payments;Username=gentlestore;Password=gentlestore_dev_pw"
      # The sandbox is a test double, not a payment provider. Development only.
      Gateways__sandbox__Enabled: "true"
      Gateways__sandbox__Credentials__dev__ApiKey: "sandbox-dev-key"
      # Paynet. Put a *test* key here and payments run through Paynet's sandbox — no real money.
      # Webhooks need a callback URL Paynet can reach, so on a laptop use a tunnel (ngrok, cloudflared)
      # and set Payments__PublicBaseUrl to it; without one, payments resolve by polling instead.
      Gateways__paynet__Enabled: "${PAYNET_ENABLED:-false}"
      Gateways__paynet__Credentials__test__ApiKey: "${PAYNET_API_KEY:-}"
      Gateways__paynet__Credentials__test__WebhookSecret: "${PAYNET_WEBHOOK_SECRET:-}"
      Gateways__paynet__Credentials__test__Domain: "${PAYNET_DOMAIN:-}"
      # Must be the origin a *browser* can reach, not the compose hostname: gateways put this in
      # redirect URLs the customer follows. Hence the published port rather than http://payments:8080.
      Payments__PublicBaseUrl: "${PAYMENTS_PUBLIC_URL:-http://localhost:5090}"
    ports:
      - "5090:8080"
    depends_on:
      postgres:
        condition: service_healthy

  console:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        APP: console
        VITE_API_URL: "http://localhost:5080"
        VITE_STOREFRONT_URL: "http://localhost:5174"
    container_name: gentlestore-console
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - api

  storefront:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        APP: storefront
        VITE_API_URL: "http://localhost:5080"
    container_name: gentlestore-storefront
    restart: unless-stopped
    ports:
      - "5174:80"
    depends_on:
      - api

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: gentlestore-pgadmin
    restart: unless-stopped
    profiles: ["tools"]
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@gentlestore.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  gentlestore_pgdata:
