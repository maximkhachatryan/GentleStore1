services:
  postgres:
    image: postgres:16
    container_name: gentlestore-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: gentlestore
      POSTGRES_USER: gentlestore
      POSTGRES_PASSWORD: gentlestore_dev_pw
    ports:
      - "5433:5432"
    volumes:
      - gentlestore_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gentlestore -d gentlestore"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: gentlestore-pgadmin
    restart: unless-stopped
    profiles: ["tools"]
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@gentlestore.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  gentlestore_pgdata:
