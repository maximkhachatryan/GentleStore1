# Global nginx-proxy overrides, included from the http block (/etc/nginx/conf.d/*.conf).
#
# nginx defaults client_max_body_size to 1m and the nginx-proxy image never sets it,
# so every upload over ~1 MB is rejected with "413 Content Too Large" before it ever
# reaches the API.
#
# Kept above the API's own 5 MB limit (UploadsController.MaxBytes) on purpose: an
# oversized upload should get the API's JSON error, not a bare nginx 413 — nginx error
# responses carry no CORS headers, so the browser reports them as an opaque failure.
client_max_body_size 10m;
