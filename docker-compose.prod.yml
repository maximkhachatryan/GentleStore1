# Production stack for a single Hetzner Cloud VM.
# Run with:  docker compose -f docker-compose.prod.yml --env-file .env up -d --build
# All secrets/domains come from the .env file (see .env.example).
# TLS is terminated by Caddy (see Caddyfile), which also obtains and renews every certificate —
# the platform's own hosts at startup, stores' own domains on their first visit.
name: gentlestore

services:
  postgres:
    image: postgres:16
    container_name: gentlestore-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - gentlestore_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # No published ports: Postgres is only reachable inside the compose network.

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gentlestore-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      Jwt__Issuer: "GentleStore"
      Jwt__Audience: "GentleStoreClients"
      Jwt__Secret: ${JWT_SECRET}
      Cors__Origins__0: "https://${STOREFRONT_DOMAIN}"
      Cors__Origins__1: "https://${CONSOLE_DOMAIN}"
      # Base of the invite links the backoffice hands out.
      Storefront__Url: "https://${STOREFRONT_DOMAIN}"
      Storefront__InviteExpiryDays: ${INVITE_EXPIRY_DAYS:-14}
      # Order alerts link back to the console.
      Console__Url: "https://${CONSOLE_DOMAIN}"
      # Telegram order alerts. Empty token or username switches them off.
      Telegram__BotToken: ${TELEGRAM_BOT_TOKEN:-}
      Telegram__BotUsername: ${TELEGRAM_BOT_USERNAME:-}
      # The storefront and the API share a registrable domain, so a Lax cookie still reaches the
      # API on storefront requests while staying blocked on requests from unrelated sites.
      # Put the two on unrelated domains and this has to become "None".
      Storefront__SessionCookie__SameSite: "Lax"
      Storefront__SessionCookie__Secure: "true"
      Seed__DemoData: ${SEED_DEMO_DATA:-false}
      Seed__SuperAdminEmail: ${SUPERADMIN_EMAIL}
      Seed__SuperAdminPassword: ${SUPERADMIN_PASSWORD}
      # Payments. The callback URL stays inside the compose network rather than going out through
      # nginx and back — it is a service-to-service call, not a browser one.
      PaymentService__BaseUrl: "http://payments:8080"
      PaymentService__CallbackBaseUrl: "http://api:8080"
      PaymentService__InternalKey: ${PAYMENTS_INTERNAL_KEY:-}
      PaymentService__CallbackSecret: ${PAYMENTS_CALLBACK_SECRET:-}
    expose:
      - "8080"
    volumes:
      - gentlestore_uploads:/app/wwwroot/uploads
    depends_on:
      postgres:
        condition: service_healthy

  # Paynet pushes webhooks from the public internet, so unlike the other services this one needs a
  # hostname the outside world can reach — set PAYMENTS_DOMAIN and uncomment its block in the
  # Caddyfile.
  #
  # Publishing the host also publishes /api/payments, so PAYMENTS_INTERNAL_KEY must be set at the
  # same time: the webhook path is exempt from it (a gateway has no key to present — it signs
  # instead), while everything that can create or refund a payment stops being open. Publishing
  # without the key would leave an unauthenticated refund endpoint on the internet.
  #
  # Leave it unpublished and the service stays reachable only from the compose network. That is
  # fine, but Paynet cannot then call back and payments resolve by polling instead.
  payments:
    build:
      context: ./payment-service
      dockerfile: Dockerfile
    container_name: gentlestore-payments
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=${POSTGRES_PAYMENTS_DB:-gentlestore_payments};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      # Empty disables the check. See PAYMENTS_INTERNAL_KEY in .env.example.
      InternalAccess__Keys__0: ${PAYMENTS_INTERNAL_KEY:-}
      # Signs the status callbacks posted back to the GentleStore API.
      Payments__Callbacks__SigningSecret: ${PAYMENTS_CALLBACK_SECRET:-}
      # Where gateways are told to post: {PublicBaseUrl}/api/webhooks/{gatewayKey}.
      # Empty means no callback_url is sent and the reconciler polls instead.
      Payments__PublicBaseUrl: ${PAYMENTS_PUBLIC_URL:-}
      # --- Paynet ---
      Gateways__paynet__Enabled: ${PAYNET_ENABLED:-false}
      Gateways__paynet__Credentials__default__ApiKey: ${PAYNET_API_KEY:-}
      Gateways__paynet__Credentials__default__WebhookSecret: ${PAYNET_WEBHOOK_SECRET:-}
      Gateways__paynet__Credentials__default__Domain: ${PAYNET_DOMAIN:-}
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy

  console:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        APP: console
        VITE_API_URL: "https://${API_DOMAIN}"
        VITE_STOREFRONT_URL: "https://${STOREFRONT_DOMAIN}"
    container_name: gentlestore-console
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      - api

  storefront:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        APP: storefront
        VITE_API_URL: "https://${API_DOMAIN}"
        # Lets the app tell the platform's domain from a store's own (see apps/storefront/src/api.ts).
        VITE_STOREFRONT_URL: "https://${STOREFRONT_DOMAIN}"
    container_name: gentlestore-storefront
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      - api

  # The only service exposed to the internet: routes by host name and terminates TLS (Caddyfile).
  caddy:
    image: caddy:2.10-alpine
    container_name: gentlestore-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      ACME_EMAIL: ${ACME_EMAIL}
      STOREFRONT_DOMAIN: ${STOREFRONT_DOMAIN}
      CONSOLE_DOMAIN: ${CONSOLE_DOMAIN}
      API_DOMAIN: ${API_DOMAIN}
      PAYMENTS_DOMAIN: ${PAYMENTS_DOMAIN:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates and ACME account state: keep this volume, or every certificate is requested
      # again on the next start and Let's Encrypt's rate limits come into play.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - console
      - storefront

volumes:
  gentlestore_pgdata:
  gentlestore_uploads:
  caddy_data:
  caddy_config:
